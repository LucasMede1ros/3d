<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="robots" content="noindex, nofollow">

    <title>Cadeira Gamer Pichau Leo Stronda, Preta | Visualizador 3D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #383838;
        }

        #viewer3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #383838;
            touch-action: none;
        }

        #viewer3d canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #383838;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        #loading.hidden {
            display: none;
        }
    </style>

    <!-- IMPORT MAP THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="viewer3d"></div>

    <div id="loading">
        CARREGANDO MODELO 3D...
    </div>

    <script type="module">

        import * as THREE from "three";

        import { OrbitControls } from
            "three/addons/controls/OrbitControls.js";

        import { GLTFLoader } from
            "three/addons/loaders/GLTFLoader.js";

        import { KTX2Loader } from
            "three/addons/loaders/KTX2Loader.js";

        import { DRACOLoader } from
            "three/addons/loaders/DRACOLoader.js";

        import { RoomEnvironment } from
            "three/addons/environments/RoomEnvironment.js";


        /* =========================================
           CONFIGURAÇÕES
        ========================================= */

        const MODEL_URL = "./LEO_STRONDA_PRETA.glb";

        const BACKGROUND_COLOR = "#383838";

        const container =
            document.getElementById("viewer3d");

        const loading =
            document.getElementById("loading");


        /* =========================================
           CENA
        ========================================= */

        const scene = new THREE.Scene();

        scene.background =
            new THREE.Color(BACKGROUND_COLOR);


        /* =========================================
           CÂMERA
        ========================================= */

        const camera = new THREE.PerspectiveCamera(
            35,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );

        camera.position.set(2, 1.5, 3);


        /* =========================================
           RENDERIZADOR
        ========================================= */

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;

        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;

        renderer.toneMappingExposure = 1.2;

        container.appendChild(renderer.domElement);


        /* =========================================
           ILUMINAÇÃO DE AMBIENTE
        ========================================= */

        const pmremGenerator =
            new THREE.PMREMGenerator(renderer);

        const roomEnvironment =
            new RoomEnvironment();

        const environmentRenderTarget =
            pmremGenerator.fromScene(roomEnvironment);

        scene.environment =
            environmentRenderTarget.texture;

        scene.environmentIntensity = 1.0;

        roomEnvironment.dispose();
        pmremGenerator.dispose();


        /* =========================================
           LUZ AMBIENTE
        ========================================= */

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                0.8
            );

        scene.add(ambientLight);


        /* =========================================
           LUZ PRINCIPAL
        ========================================= */

        const keyLight =
            new THREE.DirectionalLight(
                0xffffff,
                3.0
            );

        keyLight.position.set(4, 7, 5);

        scene.add(keyLight);


        /* =========================================
           LUZ DE PREENCHIMENTO
        ========================================= */

        const fillLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.2
            );

        fillLight.position.set(-4, 3, -2);

        scene.add(fillLight);


        /* =========================================
           LUZ TRASEIRA
        ========================================= */

        const rimLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );

        rimLight.position.set(1, 5, -5);

        scene.add(rimLight);


        /* =========================================
           CONTROLES
        ========================================= */

        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;
        controls.dampingFactor = 0.06;

        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.enablePan = false;

        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI;

        controls.minDistance = 0.5;
        controls.maxDistance = 15;

        controls.target.set(0, 0, 0);

        controls.update();


        /* =========================================
           CARREGADORES
        ========================================= */

        const loader = new GLTFLoader();

        const dracoLoader =
            new DRACOLoader();

        dracoLoader.setDecoderPath(
            "https://www.gstatic.com/draco/v1/decoders/"
        );

        loader.setDRACOLoader(dracoLoader);


        const ktx2Loader =
            new KTX2Loader();

        ktx2Loader.setTranscoderPath(
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/basis/"
        );

        ktx2Loader.detectSupport(renderer);

        loader.setKTX2Loader(ktx2Loader);


        /* =========================================
           CARREGAMENTO DO MODELO
        ========================================= */

        loader.load(

            MODEL_URL,

            (gltf) => {

                const model = gltf.scene;

                scene.add(model);


                /* CENTRALIZAR MODELO */

                const box =
                    new THREE.Box3().setFromObject(model);

                const center =
                    box.getCenter(new THREE.Vector3());

                const size =
                    box.getSize(new THREE.Vector3());

                model.position.sub(center);


                /* AJUSTAR CÂMERA */

                const maxDimension = Math.max(
                    size.x,
                    size.y,
                    size.z
                );

                const fov =
                    THREE.MathUtils.degToRad(camera.fov);

                const verticalDistance =
                    (size.y / 2) /
                    Math.tan(fov / 2);

                const horizontalDistance =
                    (size.x / 2) /
                    (
                        Math.tan(fov / 2) *
                        camera.aspect
                    );

                const distance = Math.max(
                    verticalDistance,
                    horizontalDistance,
                    maxDimension
                ) * 1.4;

                camera.position.set(
                    distance * 0.55,
                    distance * 0.25,
                    distance
                );

                camera.near =
                    Math.max(distance / 1000, 0.001);

                camera.far =
                    distance * 100;

                camera.updateProjectionMatrix();

                controls.target.set(0, 0, 0);

                controls.minDistance =
                    distance * 0.35;

                controls.maxDistance =
                    distance * 4;

                controls.update();


                /* FINALIZAR CARREGAMENTO */

                loading.classList.add("hidden");

                console.log(
                    "Modelo 3D carregado com sucesso."
                );
            },

            undefined,

            (error) => {

                console.error(
                    "Erro ao carregar modelo 3D:",
                    error
                );

                loading.textContent =
                    "NÃO FOI POSSÍVEL CARREGAR O MODELO 3D.";
            }
        );


        /* =========================================
           RESPONSIVIDADE
        ========================================= */

        window.addEventListener("resize", () => {

            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;

            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        });


        /* =========================================
           ANIMAÇÃO
        ========================================= */

        function animate() {

            requestAnimationFrame(animate);

            controls.update();

            renderer.render(scene, camera);
        }

        animate();


        /* =========================================
           FECHAMENTO DO VISUALIZADOR
        ========================================= */

        const githubOrigin =
            "https://lucasmede1ros.github.io";

        function fecharPagina() {

            if (window.parent !== window) {

                window.parent.postMessage(
                    {
                        type: "viewer3d",
                        action: "close"
                    },
                    "*"
                );

                return;
            }

            if (window.history.length > 1) {

                window.history.back();

                return;
            }

            window.location.href =
                "https://pichaugaming.com.br/";
        }

        window.addEventListener(
            "message",
            (event) => {

                if (event.origin !== githubOrigin) {
                    return;
                }

                if (
                    !event.data ||
                    event.data.type !== "viewer3d"
                ) {
                    return;
                }

                if (event.data.action === "close") {
                    fecharPagina();
                }
            }
        );

    </script>

</body>
</html>
