<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="robots" content="noindex, nofollow">

    <title>Cadeira Gamer Pichau Leo Stronda, Preta | Visualizador 3D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #383838;
        }

        #viewer3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background: #383838;
            font: 14px Arial, sans-serif;
            z-index: 10;
            pointer-events: none;
        }

        #loading.hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div id="viewer3d"></div>
    <div id="loading">CARREGANDO MODELO 3D...</div>

    <script type="module">
        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

        import { OrbitControls } from
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js";

        import { GLTFLoader } from
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js";

        import { KTX2Loader } from
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/KTX2Loader.js";

        import { DRACOLoader } from
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/DRACOLoader.js";

        import { RoomEnvironment } from
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/environments/RoomEnvironment.js";

        const container = document.getElementById("viewer3d");
        const loading = document.getElementById("loading");

        // CENA
        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#383838");

        // CÂMERA
        const camera = new THREE.PerspectiveCamera(
            35,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );

        camera.position.set(2, 1.5, 3);

        // RENDERIZAÇÃO
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });

        renderer.setSize(window.innerWidth, window.innerHeight);

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        container.appendChild(renderer.domElement);

        // ILUMINAÇÃO DE ESTÚDIO
        const pmremGenerator =
            new THREE.PMREMGenerator(renderer);

        const roomEnvironment =
            new RoomEnvironment();

        scene.environment =
            pmremGenerator.fromScene(roomEnvironment).texture;

        roomEnvironment.dispose();
        pmremGenerator.dispose();

        // LUZ AMBIENTE
        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            0.8
        );

        scene.add(ambientLight);

        // LUZ PRINCIPAL
        const keyLight = new THREE.DirectionalLight(
            0xffffff,
            3.0
        );

        keyLight.position.set(4, 7, 5);
        scene.add(keyLight);

        // LUZ DE PREENCHIMENTO
        const fillLight = new THREE.DirectionalLight(
            0xffffff,
            1.2
        );

        fillLight.position.set(-4, 3, -2);
        scene.add(fillLight);

        // LUZ TRASEIRA
        const rimLight = new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

        rimLight.position.set(1, 5, -5);
        scene.add(rimLight);

        // CONTROLES
        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;
        controls.dampingFactor = 0.06;

        controls.enableZoom = true;
        controls.enablePan = false;

        controls.minDistance = 0.5;
        controls.maxDistance = 15;

        // CARREGADORES
        const loader = new GLTFLoader();

        const dracoLoader = new DRACOLoader();

        dracoLoader.setDecoderPath(
            "https://www.gstatic.com/draco/v1/decoders/"
        );

        loader.setDRACOLoader(dracoLoader);

        const ktx2Loader = new KTX2Loader();

        ktx2Loader.setTranscoderPath(
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/basis/"
        );

        ktx2Loader.detectSupport(renderer);
        loader.setKTX2Loader(ktx2Loader);

        // CARREGAR MODELO
        loader.load(
            "./LEO_STRONDA_PRETA.glb",

            (gltf) => {
                const model = gltf.scene;

                scene.add(model);

                // CENTRALIZAR MODELO
                const box = new THREE.Box3().setFromObject(model);

                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                model.position.sub(center);

                // AJUSTAR CÂMERA
                const maxDimension = Math.max(
                    size.x,
                    size.y,
                    size.z
                );

                const fov = THREE.MathUtils.degToRad(
                    camera.fov
                );

                const aspect = camera.aspect;

                const verticalDistance =
                    (size.y / 2) / Math.tan(fov / 2);

                const horizontalDistance =
                    (size.x / 2) /
                    (Math.tan(fov / 2) * aspect);

                const distance = Math.max(
                    verticalDistance,
                    horizontalDistance,
                    maxDimension
                ) * 1.4;

                camera.position.set(
                    distance * 0.55,
                    distance * 0.25,
                    distance
                );

                camera.near = Math.max(
                    distance / 1000,
                    0.001
                );

                camera.far = distance * 100;
                camera.updateProjectionMatrix();

                controls.target.set(0, 0, 0);

                controls.minDistance = distance * 0.35;
                controls.maxDistance = distance * 4;

                controls.update();

                loading.classList.add("hidden");
            },

            undefined,

            (error) => {
                console.error(
                    "Erro ao carregar modelo 3D:",
                    error
                );

                loading.textContent =
                    "NÃO FOI POSSÍVEL CARREGAR O MODELO 3D.";
            }
        );

        // REDIMENSIONAMENTO
        window.addEventListener("resize", () => {
            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });

        // ANIMAÇÃO
        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // FECHAMENTO POR MENSAGEM
        const githubOrigin =
            "https://lucasmede1ros.github.io";

        window.addEventListener("message", (event) => {
            if (event.origin !== githubOrigin) return;

            if (
                event.data?.type === "viewer3d" &&
                event.data.action === "close"
            ) {
                if (window.parent !== window) {
                    window.parent.postMessage(
                        {
                            type: "viewer3d",
                            action: "close"
                        },
                        "*"
                    );
                } else if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href =
                        "https://pichaugaming.com.br/";
                }
            }
        });
    </script>

</body>
</html>
